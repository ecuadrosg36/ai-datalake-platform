name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install dependencies
        run: uv pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest
